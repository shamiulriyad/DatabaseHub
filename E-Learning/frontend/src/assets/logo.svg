<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80" role="img" aria-label="NextUniVerse logo">
  <defs>
    <linearGradient id="grad" x1="0" x2="1">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="0.55" stop-color="#4C1D95"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Dark rounded rectangle background like attachment -->
  <rect x="0" y="0" width="420" height="80" rx="6" ry="6" fill="#0b1220" />

  <!-- Gradient serif wordmark -->
  <text x="18" y="54" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="700" font-size="48" fill="url(#grad)" filter="url(#softShadow)">
    NextUni<tspan fill="#F59E0B">Verse</tspan>
  </text>
</svg>
